<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Brazil 2026 | Journal photo review</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="photo-review.css">
</head>
<body>
  <header class="review-header">
    <div>
      <p class="eyebrow">Brazil ’26 · private workflow</p>
      <h1>Journal photo review</h1>
      <p id="status" class="status">Loading photos…</p>
    </div>
    <div class="actions">
      <label class="button secondary">Import edits<input id="edits-input" type="file" accept=".json,application/json"></label>
      <button class="button secondary" id="download-button" type="button">Download backup</button>
      <button class="button" id="save-button" type="button">Save</button>
    </div>
  </header>
  <main>
    <p class="hint">Drag a photo to reorder it, or drag it into a different destination section. Use <strong>Exclude</strong> to leave a photo out of the site without deleting the file.</p>
    <div id="sections"></div>
  </main>
  <template id="section-template">
    <section class="leg-section">
      <header class="leg-header">
        <h2 class="leg-name"></h2>
        <span class="leg-dates"></span>
        <span class="leg-count"></span>
      </header>
      <div class="leg-grid" data-dropzone></div>
    </section>
  </template>
  <template id="photo-template">
    <article class="photo-card" draggable="true">
      <div class="preview"><img alt="" loading="lazy"></div>
      <div class="photo-copy">
        <div class="card-heading">
          <strong class="filename"></strong>
          <label class="check featured-check"><input data-field="featured" type="checkbox"> ★ Featured</label>
        </div>
        <div class="captured-at"></div>
        <label>Subject<input data-field="title" type="text" placeholder="Short headline, e.g. “The otter on the boulder”"></label>
        <label>Caption<textarea data-field="body" rows="5" placeholder="A sentence or two of story or context"></textarea></label>
        <div class="two-up">
          <label>Species<input data-field="species" type="text" placeholder="e.g. Neotropical Otter"></label>
          <label>Narrative link <small>(optional)</small><input data-field="subjectId" type="text" placeholder="e.g. otter, sp_01"></label>
        </div>
        <div class="two-up">
          <label>Latitude<input data-field="latitude" type="number" step="any" placeholder="e.g. -9.5875"></label>
          <label>Longitude<input data-field="longitude" type="number" step="any" placeholder="e.g. -55.9306"></label>
        </div>
        <label class="feedback-field">Feedback for next edit pass <small>(not published — tell Copilot what to change)</small><textarea data-field="feedback" rows="2" placeholder="e.g. “make this punchier”, “wrong animal”, “merge with the otter caption”"></textarea></label>
        <button type="button" class="exclude-toggle">Exclude from site</button>
      </div>
    </article>
  </template>
  <script src="photo-review.js"></script>
</body>
</html>
