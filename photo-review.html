<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>brazil26 review</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="photo-review.css?v=4">
</head>
<body>

<header class="top">
  <div class="brand">brazil<span>26</span> review</div>
  <div class="rule"></div>

  <div class="chips" id="chips">
    <div class="chip"><b id="n-photos">0</b> photos</div>
    <div class="chip"><b id="n-excluded">0</b> excluded</div>
    <div class="chip amber"><b id="n-notes">0</b> notes</div>
    <div class="chip cyan"><b id="n-changes">0</b> changes</div>
  </div>
  <div class="chips-compact hidden" id="chips-compact">
    <span class="n" id="c-photos">0</span>
    <span id="c-excluded">0 excl</span>
    <span class="a" id="c-notes">0 notes</span>
    <span class="c" id="c-changes">0 chg</span>
  </div>

  <div class="seg" role="group" aria-label="View">
    <button type="button" data-view="list" aria-pressed="true">List</button>
    <button type="button" data-view="sheet" aria-pressed="false">Sheet</button>
  </div>

  <div class="zoom hidden" id="zoom">
    <button type="button" id="zoom-out" title="smaller">−</button>
    <output id="zoom-label">96px</output>
    <button type="button" id="zoom-in" title="bigger">+</button>
  </div>

  <div class="spring"></div>

  <div class="sync" id="sync"><span class="dot" id="sync-dot"></span><span id="sync-text">rev 0 · in sync</span></div>
  <button type="button" class="btn stack" id="save">Save &amp; draft<small id="save-sub">nothing to save</small></button>
  <button type="button" class="btn ghost" id="publish">Publish</button>
</header>

<div class="body">
  <nav class="side">
    <h2>Legs</h2>
    <div id="legs"></div>

    <section class="legend">
      <div><i class="a"></i>needs you</div>
      <div><i class="c"></i>assistant draft</div>
    </section>

    <section>
      <h2 style="padding-left:0">Filter</h2>
      <div class="filters" id="filters">
        <button type="button" data-filter="needs" aria-pressed="false">needs you</button>
        <button type="button" data-filter="nospecies" aria-pressed="false">no species</button>
        <button type="button" data-filter="excluded" aria-pressed="false">excluded 0</button>
      </div>
    </section>

    <section>
      <h2 style="padding-left:0">File</h2>
      <div class="side-actions">
        <button type="button" class="linkish" id="download">download backup</button>
        <label class="linkish">import edits…<input id="import" type="file" accept=".json,application/json"></label>
      </div>
    </section>
  </nav>

  <main class="main">
    <div class="list-head" id="list-head">
      <h1 class="leg-name" id="leg-name"></h1>
      <div class="leg-meta" id="leg-meta"></div>
    </div>

    <div class="list" id="list"></div>

    <div class="sheet hidden" id="sheet">
      <div class="grid" id="grid"></div>
      <div class="divider" id="divider" title="drag to resize · double-click to reset"></div>
      <aside class="pane" id="pane" style="width:352px"></aside>
    </div>
  </main>
</div>

<footer class="bottom">
  <div class="tabs" role="tablist">
    <button type="button" role="tab" data-tab="recos" aria-selected="true">Recommendations <span class="pill amber" id="n-recos">0</span></button>
    <button type="button" role="tab" data-tab="changes" aria-selected="false">Changes <span class="pill cyan" id="n-changes-2">0</span></button>
    <button type="button" role="tab" data-tab="log" aria-selected="false">Run log</button>
    <div class="spring"></div>
    <div class="stale"><span class="dot hidden" id="stale-dot"></span><span id="stale-text"></span></div>
  </div>
  <div class="panel recos" id="panel-recos"></div>
  <div class="panel changes hidden" id="panel-changes"></div>
  <div class="panel log hidden" id="panel-log"></div>
</footer>

<script src="photo-review.js?v=4"></script>
</body>
</html>
